name: ingest

on:
  schedule:
    - cron: "23 */2 * * *"     # every 2 hours at :23 UTC (05:53, 07:53, 09:53 … IST)
  workflow_dispatch:           # adds a "Run workflow" button for manual runs

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAQ_KEY: ${{ secrets.OPENAQ_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt
      - run: pip install -r requirements-ingest.txt
      - name: ingest last 72 h
        run: python ingest.py --hours-back 72
      - name: healthcheck (fails the job if data is stale)
        run: python healthcheck.py