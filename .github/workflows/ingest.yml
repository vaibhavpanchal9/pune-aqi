name: ingest

on:
  schedule:
    - cron: "23 * * * *"       # best-effort fallback; the hourly trigger is cron-job.org (docs/runbook.md)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAQ_KEY: ${{ secrets.OPENAQ_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt
      - run: pip install -r requirements-ingest.txt

      - name: ingest the last 72 hours
        run: python ingest.py --hours-back 72

      # the two steps below run even if ingest failed: forecasts can still be issued from the
      # readings already in the database, and the log should always end with the health verdict
      - name: issue forecasts
        if: ${{ !cancelled() }}
        run: python forecast.py

      - name: healthcheck
        if: ${{ !cancelled() }}
        run: python healthcheck.py
