name: ci

# Every push that changes code runs the whole test suite on two Python versions and builds the API image.
# Pushes that only touch docs, notes, results or figures are skipped.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "results/**"
      - "figures/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]     # 3.12: the cloud job and the image. 3.14: the development machine.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: lint (unused and undefined names)
        run: python -m pyflakes *.py tests/*.py
      - name: tests with coverage
        # the floor only stops coverage from sliding backwards; the real number is in the log
        run: python -m pytest -q --cov=. --cov-report=term --cov-fail-under=35

  image:
    name: docker image (API tests run inside the build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t pune-aqi-api .
